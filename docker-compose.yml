# Local stack: Postgres + the NestJS API
#   docker compose up --build    -> API on http://localhost:4001/api
# Credentials below are for local development only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wisepath
      POSTGRES_PASSWORD: wisepath
      POSTGRES_DB: wisepath
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisepath -d wisepath"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://wisepath:wisepath@db:5432/wisepath
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4002}
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
